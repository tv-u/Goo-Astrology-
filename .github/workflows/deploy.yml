# Disabled during GitHub-Only Development Phase.
# Manual dispatch only; production Cloudflare Pages deployment is intentionally paused.
name: Manual Cloudflare Pages Deploy (Paused in GitHub-Only Phase)

on:
  workflow_dispatch:

jobs:
  paused-notice:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub-Only Phase Notice
        run: |
          echo "Cloudflare Pages deployment is paused during the GitHub-only development phase."
          echo "Use .github/workflows/quality.yml for CI type-check, test suite, and build checks."
